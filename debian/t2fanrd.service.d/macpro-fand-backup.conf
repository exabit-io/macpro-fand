# Installed by the macpro-fand package: t2fanrd is macpro-fand's backup fan
# governor. It starts only when macpro-fand fails for good (through
# macpro-fand-backup.service) or hands the fans over on a clean stop, never
# beside a running macpro-fand; when it stops, the fans go to full speed unless
# macpro-fand is taking them.
[Unit]
After=macpro-fand.service

[Service]
# "+" runs the guard outside t2fanrd's sandbox, which cannot reach systemd.
# may-start exits 1 to skip the start: not a failure, and no restart.
ExecCondition=+/usr/lib/macpro-fand/t2fanrd-guard may-start
ExecStopPost=+/usr/lib/macpro-fand/t2fanrd-guard stopped
