# /etc/macpro-fand.conf -- settings for macpro-fand(8); see macpro-fand.conf(5).
#
# One setting per line, NAME = value, as a Python literal. Everything here is
# commented out except the GPU cap ceiling below: the values shown are the built-in defaults, measured on a
# Mac Pro 7,1 (Xeon W-3275M, two Radeon Pro Vega II Duo). The whole file is checked
# before any of it is used: one bad setting (does not parse, wrong type or shape,
# out of range, floors that do not fit the budget) and the daemon refuses to start,
# with nothing applied; the stop hook alone carries on with the built-in defaults.
# After editing:  macpro-fand --check-config && systemctl restart macpro-fand
#
# Fans: 1 = blower (memory side), 2 = bottom front (MPX bay 1 + PCH),
#       3 = middle front (MPX bay 2, PCIe slots 5-7), 4 = top front (CPU, internal drive bay).
# What is found and charged: macpro-fand --inventory

# --- zone targets, C ----------------------------------------------------------
# Mean GPU junction of each MPX bay, held at any fan speed (37.8 C = 100 F).
#BAY_TARGET = 37.8
# Hottest HBM stack of each bay.
#HBM_TARGET = 80.0
# CPU package target against package power: (W, C) points, linear between.
#CPU_TARGET = ((133.0, 48.0), (228.0, 57.5))
# Per-fan governor floor and start speed, rpm.
#ZONES = {2: {"name": "MPX bay 1 + PCH", "floor": 500, "init": 1150},
#         3: {"name": "MPX bay 2", "floor": 500, "init": 1150},
#         4: {"name": "CPU", "floor": 500, "init": 500},
#         1: {"name": "memory side", "floor": 600, "init": 600}}

# --- power budget, W ------------------------------------------------------------
# The worst case of every limit together stays under BUDGET_LIMIT - BUDGET_MARGIN:
#   BASE + K_GPU * sum(GPU die caps) + K_CPU * PL1
#BUDGET_LIMIT = 1228.0
#BUDGET_MARGIN = 80.0
#BASE = 127.0
#K_GPU = 1.205
#K_CPU = 1.156
# Worst case added to BASE per peripheral found at start, by class (see macpro-fand.conf(5)); by PCI id in
# DEVICE_PCI_W, e.g. {"15b3:1013": 20}.
#DEVICE_W = {"mellanox": 25, "nvme": 25, "nvme-switched": 9, "pcie-switch": 10, "pcie-card": 25,
#            "disk": 25, "ssd": 8, "usb-disk": 10}
#DEVICE_PCI_W = {}
# GPU die cap range and default share, CPU PL1 range (built-in default: Vega 20's full range).
#GPU_CAP = {"floor": 85, "max": 200, "init": 125}
# Default setting: GPU dies at most 125 W. Comment it out for the full 200 W range.
GPU_CAP = {"max": 125}
#CPU_PL1 = {"floor": 80, "max": 413}
# A CPU below saturation keeps use * 1.2 + 20 W of PL1 for itself.
#CPU_KEEP = (1.2, 20.0)
# Measured DC that drops every limit to its floor for 60 s.
#BACKSTOP = 1190.0

# --- full auto: GPU working temperature ---------------------------------------
# A die's cap comes down when its junction is over T_WORK (C, band), or its
# hottest HBM stack over HBM_WORK, with its bay fan at full speed.
#T_WORK = (65.0, 1.0)
#HBM_WORK = 80.0

# --- hardware map ---------------------------------------------------------------
# GPU dies: {} = every AMD display device, its MPX bay from its PCI slot.
#DIES = {}
#MPX_BAY = {"1": 1, "2": 1, "3": 2, "4": 2}
# Fan for devices in PCI slots (NVMe, Mellanox), and for internal SATA disks (measured 2026-10-23: slots 5-7
# follow the middle fan, the internal drive bay the top fan).
#SLOT_ZONE = {"5": 3, "6": 3, "7": 3}
#DISK_ZONE = 4

# --- peripherals ----------------------------------------------------------------
# Health targets by sensor driver: (target, band, critical if the device reports none).
#PERIPH = {"nvme": (60, 1, 80), "mlx5": (80, 1, 105), "drivetemp": (40, 1, 60), "mellanox": (80, 1, 105)}
# Read period and staleness limit, s, per sensor class (each sensor has its own reader thread).
#PERIPH_POLL = {"nvme": (5, 30), "mlx5": (5, 30), "drivetemp": (30, 120), "mellanox": (15, 60)}
# A program that prints a card's temperature, for cards whose driver exposes none ({pci} = its address).
# Mellanox cards with MFT installed:
#TEMP_COMMAND = {"mellanox": ("/usr/bin/mget_temp", "-d", "{pci}")}
# Floor of a device's zone fan while the device has no live temperature sensor: an rpm, or (rpm, fan) to also
# never run slower than that fan (the default keeps fan 3 at or above fan 4: no baffle separates their air).
#UNMONITORED = {"mellanox": (1000, 4), "pcie-card": (1000, 4)}
