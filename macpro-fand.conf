# /etc/macpro-fand.conf -- settings for macpro-fand(8); see macpro-fand.conf(5).
#
# One setting per line, NAME = value, as a Python literal. Everything here is
# commented out except the GPU cap ceiling below: the values shown are the built-in defaults, measured on a
# Mac Pro 7,1 (Xeon W-3275M, two Radeon Pro Vega II Duo). A line that does not
# parse, or changes a value's type, is logged and ignored. Restart the service
# after editing:  systemctl restart macpro-fand
#
# Fans: 1 = blower (memory side), 2 = bottom front (MPX bay 1 + PCH),
#       3 = middle front (MPX bay 2, slots 5-8), 4 = top front (CPU).

# --- zone targets, C ----------------------------------------------------------
# Mean GPU junction of each MPX bay, held at any fan speed (37.8 C = 100 F).
#BAY_TARGET = 37.8
# Hottest HBM stack of each bay.
#HBM_TARGET = 80.0
# CPU package target against package power: (W, C) points, linear between.
#CPU_TARGET = ((133.0, 48.0), (228.0, 57.5))
# Per-fan governor floor and start speed, rpm.
#ZONES = {2: {"name": "MPX bay 1 + PCH", "floor": 500, "init": 1150},
#         3: {"name": "MPX bay 2", "floor": 500, "init": 1150},
#         4: {"name": "CPU", "floor": 500, "init": 500},
#         1: {"name": "memory side", "floor": 600, "init": 600}}

# --- power budget, W ------------------------------------------------------------
# The worst case of every limit together stays under BUDGET_LIMIT - BUDGET_MARGIN:
#   BASE + K_GPU * sum(GPU die caps) + K_CPU * PL1
#BUDGET_LIMIT = 1228.0
#BUDGET_MARGIN = 80.0
#BASE = 127.0
#K_GPU = 1.205
#K_CPU = 1.156
# Worst case added to BASE per uncapped device found at start.
#DEVICE_W = {"mellanox": 25.0, "nvme": 9.0, "disk": 25.0}
# GPU die cap range and default share, CPU PL1 range (built-in default: Vega 20's full range).
#GPU_CAP = {"floor": 85, "max": 200, "init": 125}
# Default setting: GPU dies at most 125 W. Comment it out for the full 200 W range.
GPU_CAP = {"max": 125}
#CPU_PL1 = {"floor": 80, "max": 413}
# A CPU below saturation keeps use * 1.2 + 20 W of PL1 for itself.
#CPU_KEEP = (1.2, 20.0)
# Measured DC that drops every limit to its floor for 60 s.
#BACKSTOP = 1190.0

# --- full auto: GPU working temperature ---------------------------------------
# A die's cap comes down when its junction is over T_WORK (C, band), or its
# hottest HBM stack over HBM_WORK, with its bay fan at full speed.
#T_WORK = (65.0, 1.0)
#HBM_WORK = 80.0

# --- hardware map ---------------------------------------------------------------
# GPU dies: {} = every AMD display device, its MPX bay from its PCI slot.
#DIES = {}
#MPX_BAY = {"1": 1, "2": 1, "3": 2, "4": 2}
# Fan for devices in PCI slots (NVMe, Mellanox), and for SATA disks.
#SLOT_ZONE = {"5": 3, "6": 3, "7": 3, "8": 3}
#DISK_ZONE = 3
